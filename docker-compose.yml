version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: micro_lending
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: micro_lending
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micro_lending"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microlend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microlend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: micro_lending
      DB_PASSWORD: secure_password
      DB_NAME: micro_lending
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-this}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - microlend

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: micro_lending
      DB_PASSWORD: secure_password
      DB_NAME: micro_lending
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    command: celery -A src.tasks.worker worker --loglevel=info
    volumes:
      - ./src:/app/src
    networks:
      - microlend

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: micro_lending
      DB_PASSWORD: secure_password
      DB_NAME: micro_lending
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    command: celery -A src.tasks.worker beat --loglevel=info
    volumes:
      - ./src:/app/src
    networks:
      - microlend

networks:
  microlend:
    driver: bridge

volumes:
  postgres_data:
  redis_data: